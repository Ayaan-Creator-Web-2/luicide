<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Embed Link Generator</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 50px;
    background-color: #f0f0f0;
  }
  h1 {
    text-align: center;
  }
  input[type="url"] {
    width: 80%;
    padding: 10px;
    font-size: 1em;
  }
  button {
    padding: 10px 20px;
    font-size: 1em;
    margin-left: 10px;
  }
  #result {
    margin-top: 20px;
    word-wrap: break-word;
    background: #fff;
    padding: 10px;
    border-radius: 5px;
  }
  textarea {
    width: 100%;
    height: 100px;
    resize: vertical;
  }
</style>
</head>
<body>

<h1>Embed Link Generator</h1>
<div style="text-align:center;">
  <input type="url" id="linkInput" placeholder="Enter URL here" />
  <button onclick="generateEmbedCode()">Generate Embed Code</button>
</div>

<div id="result" style="display:none;">
  <h2>HTML Embed Code:</h2>
  <textarea id="embedCode" readonly></textarea>
  <p>Click the code to select and copy.</p>
</div>

<script>
function generateEmbedCode() {
  const url = document.getElementById('linkInput').value.trim();
  if (!url) {
    alert('Please enter a URL.');
    return;
  }
  const embedCode = `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`;
  document.getElementById('embedCode').value = embedCode;
  document.getElementById('result').style.display = 'block';
}
</script>

</body>
</html>
