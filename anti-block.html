<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Full HTML Page Generator</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 50px;
    background-color: #f0f0f0;
  }
  h1 {
    text-align: center;
  }
  input[type="text"], input[type="url"] {
    width: 70%;
    padding: 10px;
    font-size: 1em;
    margin-bottom: 10px;
  }
  button {
    padding: 10px 20px;
    font-size: 1em;
  }
  #result {
    margin-top: 20px;
    display: none;
  }
  textarea {
    width: 100%;
    height: 300px;
    white-space: pre;
    font-family: monospace;
  }
</style>
</head>
<body>

<h1>Full HTML Page Generator</h1>

<div style="max-width:600px; margin:auto;">
  <label for="titleInput">Page Title:</label><br>
  <input type="text" id="titleInput" placeholder="Enter page title" /><br>
  <label for="linkInput">URL:</label><br>
  <input type="url" id="linkInput" placeholder="Enter URL here" /><br>
  <button onclick="generateFullHTML()">Generate HTML File</button>
</div>

<div id="result">
  <h2>Download Your HTML File</h2>
  <p>Copy the code below, save it as a .html file, and open in your browser.</p>
  <textarea id="htmlCode" readonly></textarea>
</div>

<script>
function generateFullHTML() {
  const title = document.getElementById('titleInput').value.trim() || 'My Page';
  const url = document.getElementById('linkInput').value.trim();
  if (!url) {
    alert('Please enter a URL.');
    return;
  }

  const fullHTML = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>${title}</title>
</head>
<body>
<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>
</body>
</html>`;

  document.getElementById('htmlCode').value = fullHTML;
  document.getElementById('result').style.display = 'block';
}
</script>

</body>
</html>
