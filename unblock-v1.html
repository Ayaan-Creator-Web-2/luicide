<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Link Unblocker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f0f0f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 28px 24px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }
        h1 {
            color: #e0e0e0;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 18px;
            letter-spacing: -0.3px;
        }
        .input-row {
            display: flex;
            gap: 8px;
        }
        .input-row input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #252525;
            color: #eee;
            font-size: 14px;
            outline: none;
            transition: border 0.15s;
        }
        .input-row input:focus {
            border-color: #4a9eff;
        }
        .input-row input::placeholder {
            color: #666;
        }
        .input-row button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: #4a9eff;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.15s;
            white-space: nowrap;
        }
        .input-row button:hover {
            background: #3a8aee;
        }
        .input-row button:active {
            background: #2e7ad8;
        }
        .error-msg {
            color: #f87171;
            font-size: 13px;
            margin-top: 8px;
            min-height: 20px;
        }
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 22px;
            margin-bottom: 10px;
        }
        .list-header span {
            color: #aaa;
            font-size: 14px;
        }
        .list-header .count {
            color: #888;
            font-size: 13px;
        }
        .link-list {
            list-style: none;
            max-height: 280px;
            overflow-y: auto;
            margin-bottom: 16px;
            scrollbar-width: thin;
            scrollbar-color: #333 transparent;
        }
        .link-list::-webkit-scrollbar {
            width: 5px;
        }
        .link-list::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        .link-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            background: #222;
            border-radius: 6px;
            margin-bottom: 6px;
            border: 1px solid #2a2a2a;
            transition: background 0.1s;
        }
        .link-item:hover {
            background: #282828;
        }
        .link-item a {
            flex: 1;
            color: #7ab7ff;
            font-size: 13px;
            text-decoration: none;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .link-item a:hover {
            text-decoration: underline;
        }
        .link-item .delete-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 18px;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
            transition: color 0.15s;
        }
        .link-item .delete-btn:hover {
            color: #f87171;
        }
        .empty-state {
            color: #555;
            text-align: center;
            padding: 24px 0;
            font-size: 14px;
        }
        .action-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #22c55e;
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .action-btn:hover {
            background: #16a34a;
        }
        .action-btn:active {
            background: #15803d;
        }
        .action-btn:disabled {
            background: #2a2a2a;
            color: #555;
            cursor: not-allowed;
        }
        .popup-warning {
            color: #fbbf24;
            font-size: 12px;
            margin-top: 8px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔗 Link Unblocker</h1>

        <div class="input-row">
            <input
                type="url"
                id="linkInput"
                placeholder="Paste a link and press Add…"
                autocomplete="off"
                spellcheck="false"
            />
            <button id="addBtn">Add</button>
        </div>
        <div id="errorMsg" class="error-msg"></div>

        <div class="list-header">
            <span>Saved Links</span>
            <span class="count" id="linkCount">0</span>
        </div>

        <ul id="linkList" class="link-list"></ul>

        <button id="unblockBtn" class="action-btn" disabled>
            🚀 Commence Unblock
        </button>
        <div id="popupWarning" class="popup-warning">
            ⚠️ If nothing opens, your browser may be blocking popups. Allow popups for this site and try again.
        </div>
    </div>

    <script>
        (function() {
            const STORAGE_KEY = 'unblock_links';

            // --- DOM refs ---
            const input    = document.getElementById('linkInput');
            const addBtn   = document.getElementById('addBtn');
            const errorMsg = document.getElementById('errorMsg');
            const linkList = document.getElementById('linkList');
            const countEl  = document.getElementById('linkCount');
            const unblockBtn = document.getElementById('unblockBtn');
            const popupWarning = document.getElementById('popupWarning');

            // --- Helpers ---
            function getLinks() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    return raw ? JSON.parse(raw) : [];
                } catch {
                    return [];
                }
            }

            function saveLinks(links) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(links));
            }

            function isValidUrl(string) {
                try {
                    const url = new URL(string);
                    return url.protocol === 'http:' || url.protocol === 'https:';
                } catch {
                    return false;
                }
            }

            // --- Render ---
            function render() {
                const links = getLinks();
                countEl.textContent = links.length;

                if (links.length === 0) {
                    linkList.innerHTML = `<li class="empty-state">No links yet — add one above.</li>`;
                    unblockBtn.disabled = true;
                    popupWarning.style.display = 'none';
                    return;
                }

                unblockBtn.disabled = false;
                popupWarning.style.display = 'none';

                const fragment = document.createDocumentFragment();
                links.forEach((url, index) => {
                    const li = document.createElement('li');
                    li.className = 'link-item';

                    const anchor = document.createElement('a');
                    anchor.href = url;
                    anchor.textContent = url;
                    anchor.target = '_blank';
                    anchor.rel = 'noopener noreferrer';

                    const delBtn = document.createElement('button');
                    delBtn.className = 'delete-btn';
                    delBtn.innerHTML = '&times;';
                    delBtn.setAttribute('aria-label', 'Delete link');
                    delBtn.dataset.index = index;

                    li.appendChild(anchor);
                    li.appendChild(delBtn);
                    fragment.appendChild(li);
                });

                linkList.innerHTML = '';
                linkList.appendChild(fragment);
            }

            // --- Add link ---
            function addLink() {
                const raw = input.value.trim();
                errorMsg.textContent = '';

                if (!raw) {
                    errorMsg.textContent = 'Please enter a URL.';
                    return;
                }

                // Auto-prepend https:// if missing
                let url = raw;
                if (!/^https?:\/\//i.test(url)) {
                    url = 'https://' + url;
                }

                if (!isValidUrl(url)) {
                    errorMsg.textContent = 'That doesn\'t look like a valid link (http/https).';
                    return;
                }

                const links = getLinks();
                // Avoid duplicates
                if (links.some(link => link.toLowerCase() === url.toLowerCase())) {
                    errorMsg.textContent = 'This link is already in your list.';
                    return;
                }

                links.push(url);
                saveLinks(links);
                render();
                input.value = '';
                input.focus();
            }

            // --- Delete link ---
            function deleteLink(index) {
                const links = getLinks();
                if (index >= 0 && index < links.length) {
                    links.splice(index, 1);
                    saveLinks(links);
                    render();
                }
            }

            // --- Unblock (open all) ---
            function unblockAll() {
                const links = getLinks();
                if (links.length === 0) return;

                // Open first link directly to establish popup permission
                const firstUrl = links[0];
                const firstWindow = window.open(firstUrl, '_blank');

                if (!firstWindow || firstWindow.closed || typeof firstWindow.closed === 'undefined') {
                    // Popup was blocked
                    popupWarning.style.display = 'block';
                    return;
                }

                // Open remaining links with a small delay to avoid popup blockers
                for (let i = 1; i < links.length; i++) {
                    setTimeout(() => {
                        window.open(links[i], '_blank');
                    }, i * 100); // 100ms delay between each
                }

                popupWarning.style.display = 'none';
            }

            // --- Event listeners ---
            addBtn.addEventListener('click', addLink);

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addLink();
                }
            });

            // Delegate delete clicks
            linkList.addEventListener('click', (e) => {
                const btn = e.target.closest('.delete-btn');
                if (btn) {
                    const index = parseInt(btn.dataset.index, 10);
                    if (!isNaN(index)) {
                        deleteLink(index);
                    }
                }
            });

            unblockBtn.addEventListener('click', unblockAll);

            // --- Init ---
            render();
        })();
    </script>
</body>
</html>
